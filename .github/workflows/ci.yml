name: CI

# Runs the same checks as `npm run verify` on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser tests run in Chromium and in WebKit, the engine of Safari.
      - name: Install the browsers for the tests
        run: npx playwright install --with-deps chromium webkit

      - name: Format, lint, type-check, build and test in browsers
        run: npm run verify

      - name: Keep the recordings of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

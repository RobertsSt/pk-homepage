# Homepage content. When the presidium changes, update `presiding` and `officers`.

name:
  lv: Prezidiju Konvents
  en: Presidium Convent
tagline:
  lv: Latvijas studentu korporāciju apvienība
  en: The union of Latvia's student fraternities
lead:
  lv: P!K! jeb Prezidiju Konvents ir organizācija, kas apvieno visas Latvijas studentu korporācijas.
  en: P!K!, the Presidium Convent, is the organisation that unites all of Latvia's student fraternities.
intro:
  lv: >-
    Tās uzdevums ir pieņemt korporācijām saistošus lēmumus, izšķirt strīdus situācijas starp
    korporāciju biedriem vadoties no buršu tradīcijām un vadīt korporāciju savstarpējo dzīvi kopumā.
    P!K! lēmumi tiek pieņemti balsojot, kur katrai korporācijai ir viena balss. Katru semestri P!K!
    vada prezidijs, kas tiek ievēlēts no vienas korporācijas, rotācijas kārtībā. P!K! ir oficiāli
    reģistrēta biedrība Latvijā.
  en: >-
    Its task is to adopt decisions that bind the fraternities, to settle disputes between their
    members in keeping with fraternity tradition, and to guide the fraternities' common life as a
    whole. P!K! decides by vote, and each fraternity has one vote. Every semester P!K! is led by a
    presidium elected from a single fraternity, in rotation. P!K! is an officially registered
    association in Latvia.

foundedYear: 1919


history:
  teaser:
    lv: >-
      1919. g. 27. septembrī Rīgā, pie Latvijas Universitātes nodibinājās studentu korporāciju
      apvienība – Latvijas Universitātes Prezidiju Konvents – P!K! Prezidiju Konvents ar savām
      institūcijām: Prezidiju Konventu (visu P!K! ieejošo studentu korporāciju prezidiju locekļu
      kopsapulce), G!T! un P!K!T!, pieņemot lēmumus un izdodot noteikumus, vadīja un regulēja visu
      korporāciju savstarpējo sadzīvi un attiecības. P!K! tā tad bija Latvijas Universitātes studentu
      korporāciju augstākais pārvaldes orgāns.
    en: >-
      On 27 September 1919 in Riga, a union of student fraternities was founded at the University of
      Latvia: the Presidium Convent of the University of Latvia, P!K!. Through its institutions,
      namely the Presidium Convent (the general assembly of the presidium members of all member
      fraternities), G!T! and P!K!T!, it adopted decisions and issued rules that guided and
      regulated relations among all the fraternities. P!K! was thus the highest governing body of
      the student fraternities of the University of Latvia.
  # Each line is taken from the history page (pk-vesture); keep the two in step.
  milestones:
    - year: '1919'
      text:
        lv: 27. septembrī piecas latviešu korporācijas Rīgā dibina kopēju apvienību.
        en: On 27 September five Latvian fraternities found a common union in Riga.
    - year: '1920'
      text:
        lv: Apvienība pieņem nosaukumu Prezidiju Konvents — P!K!
        en: The union takes the name Prezidiju Konvents, P!K!
    - year: '1940'
      text:
        lv: 13. jūlijā padomju okupācijas vara slēdz korporācijas. P!K! bija darbojies 42 semestrus.
        en: On 13 July the Soviet occupation authorities close the fraternities. P!K! had been active for 42 semesters.
    - year: '1990'
      text:
        lv: 15. martā piecpadsmit korporācijas atjauno P!K! darbību.
        en: On 15 March fifteen fraternities restore P!K!.

